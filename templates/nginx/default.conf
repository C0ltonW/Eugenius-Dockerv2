server {
    listen 80;
    server_name _;

    # Magento docroot
    root /var/www/html/pub;
    index index.php index.html;

    # Security headers (dev-friendly)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # ------------------------------------------------------------------------------
    # IMPORTANT: Prefer Magento handlers for /static and /media before regex blocks
    # ------------------------------------------------------------------------------

    # /static => let Magento handle (with versioned-URL support)
    location ^~ /static/ {
        # Strip version signature if present (e.g., /static/version12345/...)
        # and then fall back to static.php with the path *without* the /static/ prefix
        # Examples adapted from Magento's sample config.  [refs below]
        location ~ ^/static/version\d*/(.*)$ {
            rewrite ^/static/(version\d*/)?(.*)$ /static/$2 last;
        }

        # First try a real file/dir, then hand off to static.php with the rewritten resource
        try_files $uri $uri/ @magento_static;
    }

    location @magento_static {
        rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
    }

    # /media => generated media fallback via get.php
    location ^~ /media/ {
        try_files $uri $uri/ /get.php?$args;
    }

    # ------------------------------------------------------------------------------
    # Generic asset regex (WILL NOT intercept /static or /media due to ^~ above)
    # ------------------------------------------------------------------------------

    location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg|webp|avif)$ {
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    # ------------------------------------------------------------------------------
    # Front controller
    # ------------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ------------------------------------------------------------------------------
    # PHP-FPM
    # ------------------------------------------------------------------------------

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;

        # Use real paths so symlinks resolve correctly
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_pass php:9000;
        fastcgi_index index.php;

        # Dev-friendly PHP overrides
        fastcgi_param PHP_VALUE "memory_limit=2G
        max_execution_time=1800
        upload_max_filesize=64M
        post_max_size=64M";
    }

    # ------------------------------------------------------------------------------
    # Deny access to sensitive files
    # ------------------------------------------------------------------------------

    location ~* (\.git|\.env|composer\.(json|lock)|auth\.json|package\.json|phpunit\.xml) {
        deny all;
    }
}
